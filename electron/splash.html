<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DockTerm</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1c23;
        color: #e8eaef;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        background:
          radial-gradient(
            900px 420px at 50% -10%,
            rgba(59, 130, 246, 0.16),
            transparent 60%
          ),
          #1a1c23;
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        background: #11131a;
      }
      .logo-fallback {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        display: none;
        place-items: center;
        background: linear-gradient(145deg, #3b82f6, #1d4ed8);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .status {
        font-size: 13px;
        color: #9aa0ae;
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: #2a2e38;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img
        class="logo"
        id="logo"
        src="../build/icon.png"
        width="88"
        height="88"
        alt="DockTerm"
      />
      <div class="logo-fallback" id="logo-fallback" aria-hidden="true">D</div>
      <div class="brand">DockTerm</div>
      <div class="status" id="status">Starting…</div>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
    <script>
      const logo = document.getElementById('logo');
      const fallback = document.getElementById('logo-fallback');
      logo.addEventListener('error', () => {
        logo.style.display = 'none';
        fallback.style.display = 'grid';
      });

      const messages = [
        'Starting…',
        'Starting backend…',
        'Loading terminals…',
      ];
      let i = 0;
      const el = document.getElementById('status');
      setInterval(() => {
        i = (i + 1) % messages.length;
        el.textContent = messages[i];
      }, 1400);

      window.addEventListener(
        'mouseup',
        (e) => {
          if (e.button === 3 || e.button === 4) e.preventDefault();
        },
        true
      );
    </script>
  </body>
</html>
